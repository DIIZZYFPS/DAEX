name: Android CI

on:
  push:
    paths:
      - 'DaexAndroid/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'DaexAndroid/**'
      - '.github/workflows/android-ci.yml'

# Cancel any in-progress run for the same branch/PR when new commits land, instead of
# burning CI minutes on now-superseded pushes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint & detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android Lint
        working-directory: DaexAndroid
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace

      - name: Run detekt
        working-directory: DaexAndroid
        run: ./gradlew detekt --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: DaexAndroid/app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: DaexAndroid/app/build/reports/detekt/
          retention-days: 14

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Covers unit, integration (real ObjectBox/FTS), Compose UI, snapshot (Roborazzi), and the
      # JVM-simulated end-to-end scenario test - all run under the same testDebugUnitTest task.
      # -Pkapt.use.k2 gets a real diagnostic instead of K1 kapt's opaque "Could not load module
      # <Error module>" if a multi-file compile error ever shows up here.
      - name: Run unit tests
        working-directory: DaexAndroid
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -Pkapt.use.k2=true --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: DaexAndroid/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # Instrumented tests (app/src/androidTest) and the :macrobenchmark module require a real
      # device/emulator and are intentionally not run here - see each test file's own doc comment.
