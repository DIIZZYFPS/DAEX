name: Android CI

on:
  push:
    paths:
      - 'DaexAndroid/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'DaexAndroid/**'
      - '.github/workflows/android-ci.yml'

# Cancel any in-progress run for the same branch/PR when new commits land, instead of
# burning CI minutes on now-superseded pushes.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        working-directory: DaexAndroid
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: DaexAndroid/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
