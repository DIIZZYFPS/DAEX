name: Deploy public site

# Publishes ONLY the top-level public/ folder to GitHub Pages - deliberately isolated from the
# rest of the repo (docs/ in particular contains internal planning notes for unrelated projects
# that must never be exposed). Add new public-facing pages under public/, never elsewhere.
on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
