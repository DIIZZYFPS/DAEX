name: Attach signed APKs to a release

# Recovery/backstop for release.yml: if that workflow's job failed or was aborted before its
# "Upload APKs to GitHub Release" step ran (e.g. an earlier step errored), the release tag exists
# but has no APK assets attached. This rebuilds the exact same signed APKs from that tag's commit
# and attaches them - manual only, since it's a recovery tool, not part of the normal release flow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (blank = most recent release)'
        required: false
        default: ''

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve target tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag (no releases found, or gh call failed)." >&2
            exit 1
          fi
          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code at resolved tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode signing keystore
        working-directory: DaexAndroid
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/daex-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/daex-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=daex-release
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Build signed APKs
        run: |
          cd DaexAndroid
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Remove signing keystore
        if: always()
        working-directory: DaexAndroid
        run: rm -rf keystore keystore.properties

      - name: Upload APKs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload ${{ steps.tag.outputs.tag }} DaexAndroid/app/build/outputs/apk/release/app-release.apk --clobber
          gh release upload ${{ steps.tag.outputs.tag }} DaexAndroid/app/build/outputs/apk/debug/app-debug.apk --clobber
